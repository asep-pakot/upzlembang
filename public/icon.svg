<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="upzGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#upzGrad)"/>
  
  <!-- Subtle Islamic Geometric Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(251, 191, 36, 0.25)" stroke-width="4" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>
  
  <!-- Central Emblem: Dome, Giving Hands, Crescent, and Star -->
  <g filter="url(#shadow)">
    <!-- Crescent & Star -->
    <path d="M 276 90 A 38 38 0 1 0 276 150 A 30 30 0 1 1 276 90 Z" fill="url(#goldGrad)" />
    <polygon points="296,112 300,122 311,122 302,128 305,138 296,132 287,138 290,128 281,122 292,122" fill="url(#goldGrad)"/>

    <!-- Mosque Dome Silhouette -->
    <path d="M 256 140 C 220 180 200 210 200 260 L 312 260 C 312 210 292 180 256 140 Z" fill="#ffffff" fill-opacity="0.95"/>
    <rect x="236" y="220" width="40" height="40" rx="20" fill="#047857"/>

    <!-- Generous Giving Hands Shape -->
    <path d="M 170 300 C 190 280 230 310 256 325 C 282 310 322 280 342 300 C 362 320 330 360 256 400 C 182 360 150 320 170 300 Z" fill="url(#goldGrad)" opacity="0.95"/>
    
    <!-- Heart / Seed of Zakat in center -->
    <circle cx="256" cy="305" r="14" fill="#ffffff"/>
  </g>

  <!-- Typography -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="2">UPZ LEMBANG</text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" fill="#fde68a" text-anchor="middle" letter-spacing="4">KAB. BANDUNG BARAT</text>
</svg>
